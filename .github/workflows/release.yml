name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  publish:
    name: Build, pack and publish to NuGet
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Resolve version from tag
        id: version
        run: |
          TAG="${GITHUB_REF_NAME}"
          VERSION="${TAG#v}"
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "Tag '$TAG' is not a valid 'v<major>.<minor>.<patch>' semantic version tag." >&2
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      # Dependency releases tag '<PackageId>/v<version>' (see dependency-release.yml): a full release must
      # be newer than all of them, or NuGet would skip the packages they already published at that version.
      - name: Check version is newer than dependency releases
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          newest=$(git ls-remote --tags --refs origin | sed -nE 's|.*refs/tags/[^/]+/v([0-9]+\.[0-9]+\.[0-9]+)$|\1|p' | sort -V | tail -n 1)
          if [ -n "$newest" ] && [ "$(printf '%s\n%s\n' "$newest" "${VERSION%%-*}" | sort -V | tail -n 1)" = "$newest" ]; then
            echo "Version $VERSION is not newer than $newest, already published by a dependency release." >&2
            exit 1
          fi

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore Shinboku.Polochon.slnx

      - name: Build
        run: dotnet build Shinboku.Polochon.slnx --no-restore -c Release -p:Version=${{ steps.version.outputs.version }}

      - name: Test
        run: dotnet test --solution Shinboku.Polochon.slnx --no-build -c Release

      - name: Pack
        run: >
          dotnet pack Shinboku.Polochon.slnx --no-build -c Release
          -p:Version=${{ steps.version.outputs.version }}
          --output artifacts/nupkgs

      - name: Push to NuGet
        run: >
          dotnet nuget push "artifacts/nupkgs/*.nupkg"
          --api-key ${{ secrets.NUGET_API_KEY }}
          --source https://api.nuget.org/v3/index.json
          --skip-duplicate

      - name: Create GitHub release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
          files: artifacts/nupkgs/*.nupkg
